# ⚠ required status check 컨텍스트는 아래 job 의 이름에서 파생된다.
#   워크플로우 name 이나 job 키를 바꾸면 브랜치 보호 규칙이 조용히 풀려서
#   아무 검사도 통과하지 않은 PR 이 merge 가능해진다. 바꾸지 마라.
#   실제 컨텍스트 문자열은 첫 실행 후 아래 명령으로 확인해 등록한다.
#     gh api repos/seorilabs/starlit-apprentice/commits/<sha>/check-runs --jq '.check_runs[].name'
#
# ⚠ paths: 필터를 두지 않는다. 필터에 안 걸리는 PR 에서 required check 가
#   영영 보고되지 않아 merge 가 영구히 막힌다.
#
# ⚠ 로그 게이트는 org 재사용 워크플로우가 아니라 scripts/ 에 있다.
#   재사용 워크플로우는 넘긴 check_command 를 실행할 뿐 로그를 검사하지 않는다.
#   Godot 은 GDScript 파스 에러에도 exit 0 을 내므로 scripts/test_all.sh 가
#   ANSI 를 제거한 뒤 ^(SCRIPT ERROR|ERROR): 를 찾아 실패시킨다.
name: Godot Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot:
    name: Godot Compile
    uses: seorilabs/.github/.github/workflows/godot-checks.yml@main
    with:
      godot_version: "4.7.2"
      godot_status: stable
      project_dir: "."
      with_export_templates: false
      timeout_minutes: 25
      runs_on: ubuntu-latest
      e2e_report_path: build/e2e
      check_command: |
        python3 tools/check_core_boundary.py .
        python3 tools/validate_content.py .
        bash scripts/check_docs.sh
        for pass in first second; do
          rm -rf .godot
          export GODOT_TEST_LOG_DIR="build/e2e/clean-$pass"
          bash scripts/test_all.sh
          bash scripts/godot_quality_gate.sh --project .
        done
        for locale in ko en; do
          for viewport in 640x1136 720x1280 720x1600; do
            width="${viewport%x*}"
            height="${viewport#*x}"
            output="build/e2e/render-$locale-$viewport"
            python3 scripts/run_godot.py --log "$output.log" -- \
              xvfb-run -a godot --rendering-driver opengl3 --path . \
              --script res://tools/e2e/journey.gd -- --out "$output" \
              --locale "$locale" --capture --width "$width" --height "$height"
          done
        done
        find build/e2e -type f ! -name sha256sums.txt -print0 | sort -z | \
          xargs -0 sha256sum > build/e2e/sha256sums.txt

  # main에서는 export하지 않는다. 실제 Web 산출물 검사는 수동 workflow가 맡는다.
  # ⚠ 이 job 의 name 도 required check 컨텍스트를 만든다. 바꾸지 마라.
  web-budget:
    name: Web Budget
    uses: seorilabs/.github/.github/workflows/godot-checks.yml@main
    with:
      godot_version: "4.7.2"
      godot_status: stable
      project_dir: "."
      with_export_templates: false
      timeout_minutes: 25
      runs_on: ubuntu-latest
      check_command: |
        python3 tools/check_android_release.py --source-only
